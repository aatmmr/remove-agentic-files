name: Self test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: Self test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Make the fixture tree
        run: |
          mkdir -p fixture/.cursor/rules
          mkdir -p fixture/packages/api
          mkdir -p fixture/packages/web/deep
          mkdir -p fixture/.github/instructions
          mkdir -p fixture/vendor
          echo root          > fixture/AGENTS.md
          echo nested        > fixture/packages/api/AGENTS.md
          echo deep          > fixture/packages/web/deep/AGENTS.md
          echo vendor        > fixture/vendor/AGENTS.md
          echo claude        > fixture/CLAUDE.md
          echo rule          > fixture/.cursor/rules/one.mdc
          echo instructions  > fixture/.github/instructions/a.instructions.md
          echo copilot       > fixture/.github/copilot-instructions.md
          echo keep          > fixture/README.md
          printf '# protect the vendor folder\n!vendor/**\n' > fixture/.agentic-files

      - name: Run the action in the dry-run mode
        id: dry
        uses: ./
        with:
          agents: all
          working-directory: fixture
          config: fixture/.agentic-files
          dry-run: true
          summary: none

      - name: The dry run must keep every file
        run: |
          test -f fixture/AGENTS.md
          test -f fixture/CLAUDE.md
          test -d fixture/.cursor
          test "${{ steps.dry.outputs.deleted-count }}" -gt 0

      - name: Run the action
        id: clean
        uses: ./
        with:
          agents: copilot, claude, cursor
          patterns: |
            # an extra pattern from the workflow
            **/*.orig
          config: fixture/.agentic-files
          working-directory: fixture
          summary: job-summary

      - name: The action must remove the agentic files
        run: |
          test ! -e fixture/AGENTS.md
          test ! -e fixture/packages/api/AGENTS.md
          test ! -e fixture/packages/web/deep/AGENTS.md
          test ! -e fixture/CLAUDE.md
          test ! -e fixture/.cursor
          test ! -e fixture/.github/instructions
          test ! -e fixture/.github/copilot-instructions.md

      - name: The action must keep the other files
        run: |
          test -f fixture/README.md
          test -f fixture/vendor/AGENTS.md

      - name: The outputs must report the deletion
        run: |
          echo "count: ${{ steps.clean.outputs.deleted-count }}"
          echo '${{ steps.clean.outputs.deleted-files }}'
          test "${{ steps.clean.outputs.deleted-count }}" -eq 7
          echo '${{ steps.clean.outputs.deleted-files }}' | grep -q '"AGENTS.md"'
          echo '${{ steps.clean.outputs.deleted-files }}' | grep -q '".cursor"'

      - name: A second run must find nothing
        id: again
        uses: ./
        with:
          agents: copilot, claude, cursor
          config: fixture/.agentic-files
          working-directory: fixture
          summary: inline

      - name: The second run must report no deletion
        run: |
          test "${{ steps.again.outputs.deleted-count }}" -eq 0
          test -f fixture/vendor/AGENTS.md

      - name: A run without the protection must remove the vendor file
        id: vendor
        uses: ./
        with:
          patterns: '**/AGENTS.md'
          working-directory: fixture
          summary: none

      - name: The vendor file must be gone
        run: |
          test "${{ steps.vendor.outputs.deleted-count }}" -eq 1
          test ! -e fixture/vendor/AGENTS.md

      - name: An unknown agent key must fail the action
        id: bad-agent
        continue-on-error: true
        uses: ./
        with:
          agents: not-an-agent
          working-directory: fixture

      - name: An unknown summary value must fail the action
        id: bad-summary
        continue-on-error: true
        uses: ./
        with:
          patterns: README.md
          working-directory: fixture
          summary: table

      - name: A pattern with .. must fail the action
        id: bad-pattern
        continue-on-error: true
        uses: ./
        with:
          patterns: ../README.md
          working-directory: fixture

      - name: A missing config file must fail the action
        id: bad-config
        continue-on-error: true
        uses: ./
        with:
          config: fixture/does-not-exist.txt
          working-directory: fixture

      - name: fail-on-no-match must fail the action
        id: no-match
        continue-on-error: true
        uses: ./
        with:
          patterns: does-not-exist.md
          working-directory: fixture
          fail-on-no-match: true

      - name: The five error cases must fail
        run: |
          test "${{ steps.bad-agent.outcome }}" = failure
          test "${{ steps.bad-summary.outcome }}" = failure
          test "${{ steps.bad-pattern.outcome }}" = failure
          test "${{ steps.bad-config.outcome }}" = failure
          test "${{ steps.no-match.outcome }}" = failure
          test -f fixture/README.md
